; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; 
; Changes 20230120, 20261018 (v3.2.0 upload_port), 20261021 (v4.0.0, v5.0.0, v5.1.0), 20261022 (v6.0.0, v6.1.0, v6.2.0, v6.3.0), 20261025 (v6.4.0)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; C++17: see COMPILER AND C++ STANDARD at the end of this file.
; build_unflags = -std=gnu++11
; build_unflags = -std=c++11
;
build_flags = -std=gnu++11
;
; build_src_filter uses +<*> as wild card for 
; folders placed inside the src-folder..., 
; all folders have to be accounted where + indicates 
; the active folder, - indicates folders to ignore...
; Step1_Joystick: the joystick self test (Joystick Setup, v6.0.0).
; Step2_JUL: the diagnostic program (L298N Setup); Step3 to Step5:
;       generator, generated program, math lessons (notes below).
; Renumbered 20261021 (v4.0.0). Shipped setting: Step1_Joystick.
build_src_filter =
    +<*>
    +<Step1_Joystick/>
    -<Step2_JUL/>
    -<Step3_Generator/>
    -<Step4_Generated/>
    -<Step5_MathLessons/>
;
; Notes on build_src_filter (added 20261008, revised 20261021, v5.0.0;
; one folder per line since 20261025, v6.4.0):
; Exactly one program may be compiled at a time, because each folder
; defines its own setup() and loop(). The filter is read from top to
; bottom: +<*> starts with every folder, each - removes a folder, and
; a + adds one folder back. Lines 31 to 37 hold the filter, one entry
; per line; each continuation line starts with spaces. Every setting
; must account for all five folders: Step1_Joystick, Step2_JUL,
; Step3_Generator, Step4_Generated, and Step5_MathLessons.
; To select a program, give its line the sign + and the other four
; folder lines the sign -. Line 32, +<*>, stays as written. Example,
; Step2_JUL:
;   build_src_filter =
;       +<*>
;       -<Step1_Joystick/>
;       +<Step2_JUL/>
;       -<Step3_Generator/>
;       -<Step4_Generated/>
;       -<Step5_MathLessons/>
; The programs:
;   Step1_Joystick     the joystick self test (shipped setting); it
;                      prints include/JoystickCenter.h (v6.4.0)
;   Step2_JUL          the diagnostic program of L298N Setup
;   Step3_Generator    checks the joystick center and the pins, asks
;                      for the Bits() value, and prints Step4_Generated
;   Step4_Generated    the printed drive program (include/claude/ace.h)
;   Step5_MathLessons  the math lessons; select ONE lesson with the
;                      line #define LESSON in
;                      Code-JUL/src/Step5_MathLessons/main.cpp, and ONE
;                      topic, or 0 for all, with the line #define TOPIC
;                      below it (v5.1.0)
; Up to v6.3.1 the filter was one line, line 31, and the notes gave
; one complete line for each program, to be copied over line 31. The
; author's bench test of 20261024 confirmed that the filter may be
; written over several lines.
;
; Lessons (v5.0.0): one header each in Step5_MathLessons/lessons/,
;   L01_Bitwise L02_TypeConv L03_LinearMap L04_MiscMath
;   L05_RandomNumber L06_Statistics L07_Vector2 L08_Point2 L09_Vector3
;   L10_Point3 L11_Matrix2x2 L12_Matrix3x3 L13_Matrix4x4 L14_Quaternion
;   L15_LineFit L16_Rotation L17_DeadZone L18_MotorLineFit
;   L19_JoystickFrame L20_JoystickMap (v6.1.0). Up to v4.0.1 each lesson was a folder with its
; own main.cpp, selected here with a sixth entry of the filter.
;
; Ubuntu to Device Port - 20230116
; VSCode - PlatformIO - Arduino Uno: 
;    /dev/ttyACM0: Permission Denied Issue
; ISSUE: “Permission denied” error on the serial 
; port /dev/ttyACM0 while uploading the Arduino 
; sketch.
; FIX from the Source: 
; https://www.shellhacks.com/arduino-dev-ttyacm0-permission-denied
; Terminal Commands
;   'stat /dev/ttyACM0' <to check the status>
; To permanently solve the issue with the permissions 
; for /dev/ttyACM0 ,
; add the user to the dialout group:
;   'sudo usermod -a -G dialout <username>'
;
; Issue occurs after re-installing VSCode
; Source:
; https://linuxiac.com/install-visual-studio-code-on-ubuntu-22-04/
;
; Raspberry Pi 5, Raspberry Pi OS to Device Port - 20261017
; The author's development computer. VSCode - PlatformIO - Arduino Uno:
; an Uno with the ATmega16U2 USB chip appears as /dev/ttyACM0; a
; clone with a CH340 USB chip appears as /dev/ttyUSB0.
; Terminal Commands
;   'ls /dev/ttyACM* /dev/ttyUSB*' <to find the port>
;   'ls -l /dev/serial/by-id/' <a name that stays the same when
;                               other USB devices are connected>
;   'groups' <the user must be in the dialout group>
; The first user of Raspberry Pi OS is normally in the dialout group.
; If not, the Ubuntu fix above applies:
;   'sudo usermod -a -G dialout <username>', then log out and in.
monitor_speed = 9600
;
; Monitor log file (in env:step3 up to v3.0.0, here since v3.0.1):
; the PlatformIO monitor also saves its output in a log file in this
; folder, so the program printed by Step3_Generator can be copied
; from the file (the log files are listed in .gitignore).
monitor_filters = default, log2file
;
; Upload port (REQUIRED, revised 20261018 for v3.2.0; up to v3.1.2
; the port was left to automatic detection). The author's bench test
; showed that the upload does not work without it. Before the first
; upload, remove the comment mark from ONE upload_port line and the
; monitor_port line below it, and change both to the port of YOUR
; computer; pio device list prints the ports. The monitor_port line
; keeps the serial monitor of Step2_JUL and Step3_Generator on the
; same port.
; macOS:
; upload_port = /dev/cu.usbmodem*
; Linux:
; upload_port = /dev/ttyACM0
; Raspberry Pi 5, Raspberry Pi OS (CH340 clone: /dev/ttyUSB0):
; upload_port = /dev/ttyACM0
; Windows:
; upload_port = COM4
; All computers, the same port as upload_port:
; monitor_port = /dev/ttyACM0
;
; Step3_Generator and Step4_Generated (added 20261017 under these
; names, Step2_Generator and Step3_Generated from v3.1.0 to v3.2.2,
; and Step3_Generator and Step4_Generated again since v4.0.0): up to v3.0.0
; they were built in environments env:step3 and env:step4 with the
; flags STEP3_GENERATOR and STEP4_GENERATED. Since v3.0.1 they are
; selected with build_src_filter above, like every other program.
;
; =====================================================================
; COMPILER AND C++ STANDARD (Notes on the C++ standard, added 20261017
; for v3.0.1; collected and reorganized here 20261022, v6.3.0)
; =====================================================================
;
; 1. The compiler and the standard are two different numbers
;   avr-gcc 7.3.0 is the version of the GNU compiler of the atmelavr
;   platform. gnu++11 and gnu++17 name the C++ standard the compiler is
;   told to follow; they are not related to the version number. The
;   macro __cplusplus shows the standard in effect. With avr-gcc 7.3.0:
;     -std=gnu++11   __cplusplus 201103 (C++11, the shipped setting)
;     -std=gnu++14   __cplusplus 201402 (C++14)
;     -std=gnu++17   __cplusplus 201703 (C++17)
;     no -std flag   __cplusplus 201402: avr-gcc 7.3.0 defaults to
;                    C++14, not C++11, which is why line 21 sets it.
;
; 2. gnu++ and c++
;   -std= selects the standard, and each standard has two forms.
;     -std=c++11     strict ISO C++11, the official standard only; the
;                    compiler defines __STRICT_ANSI__.
;     -std=gnu++11   the same C++11 with the GNU extensions, additions
;                    of the GNU compiler: binary constants 0b1011
;                    (standard only since C++14; lesson 1 uses them),
;                    variable length arrays int v[n], typeof,
;                    __attribute__, and case ranges (case 1 ... 5:).
;   The same holds for every standard: c++17 and gnu++17. The Arduino
;   AVR core is compiled with the gnu form, so this file uses gnu++11
;   (gnu++17 for C++17). With the option -pedantic, both forms warn
;   about the extensions, for example "binary constants are a C++14
;   feature or GCC extension".
;
; 3. The standard of the series
;   The series is written for C++11 (GNU++11), the standard of
;   build_flags in Article 1004 (Experiment-2, Lab 1). The shipped
;   setting stays -std=gnu++11 to match the articles.
;
; 4. Selecting C++17
;   The Arduino AVR framework passes -std=gnu++11 itself, so
;   build_flags = -std=gnu++17 alone would hand the compiler two
;   standards. To use C++17, change lines 18 and 21 to:
;     build_unflags = -std=gnu++11
;     build_flags = -std=gnu++17
;   C++17 mostly adds features; it also removes a few old ones (the
;   keyword register, std::auto_ptr), which is why both standards are
;   checked (item 6).
;
; 5. What avr-gcc 7.3.0 supports
;   The C++17 language features: if constexpr, structured bindings,
;   inline variables, fold expressions, constexpr lambdas. The AVR
;   toolchain has no C++ standard library, so <vector>, <optional>,
;   <array>, and the other library headers remain unavailable, as with
;   C++11.
;
; 6. Checks
;   20261017 (avr-gcc 7.3.0, ArduinoCore-avr 1.8.6, -std=gnu++17): the
;   Arduino core compiles with no warnings; Step2_JUL builds to the same
;   Intel HEX as with -std=gnu++11; Step3_Generator, Step4_Generated,
;   and lessons 07, 14, and 16 build with no warnings.
;   20261022 (v6.3.0, -Wall -Wextra): Step1_Joystick to Step4_Generated
;   and every lesson with every topic build with no warnings with both
;   -std=gnu++11 and -std=gnu++17.
;   20261022 (v6.3.1, -Wall -Wextra): the same 141 builds, and the 13 lab
;   programs of Experiments 1 to 5, build with no warnings with both
;   -std=gnu++11 and -std=gnu++17, to the same size under both.
