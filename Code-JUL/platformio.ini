; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; 
; Changes 20230120, 20261018 (v3.2.0: upload_port required, below)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; C++17: see Notes on the C++ standard, below line 31.
; build_unflags = -std=gnu++11
; build_unflags = -std=c++11
;
build_flags = -std=gnu++11
;
; build_src_filter uses +<*> as wild card for 
; folders placed inside the src-folder..., 
; all folders have to be accounted where + indicates 
; the active folder, - indicates folders to ignore...
; Step1_Joystick was removed on 20261017: the Bits() value found
;       with the checklist corrects any joystick orientation.
; Step1_JUL: - Joystick-Uno-L298N: main.cpp
; Step2 to Step4: generator, generated program, lessons (notes below)
build_src_filter = +<*> +<Step1_JUL/> -<Step2_Generator/> -<Step3_Generated/> -<Step4_MathLessons/>
;
; Notes on build_src_filter (added 20261008, revised 20261018):
; Exactly one program may be compiled at a time, because each folder
; defines its own setup() and loop(). The filter is read from left to
; right: +<*> starts with every folder, each - removes a folder, and a
; + that follows a - adds one folder back. Every setting must account
; for all four folders: Step1_JUL, Step2_Generator, Step3_Generated,
; and Step4_MathLessons. Copy one of the lines below over line 31.
;
; Step1_JUL (shipped setting):
;   build_src_filter = +<*> +<Step1_JUL/> -<Step2_Generator/> -<Step3_Generated/> -<Step4_MathLessons/>
; Step2_Generator (checks the pins, asks for the Bits() value, and
; prints Step3_Generated):
;   build_src_filter = +<*> -<Step1_JUL/> +<Step2_Generator/> -<Step3_Generated/> -<Step4_MathLessons/>
; Step3_Generated (the printed drive program, include/claude/ace.h):
;   build_src_filter = +<*> -<Step1_JUL/> -<Step2_Generator/> +<Step3_Generated/> -<Step4_MathLessons/>
; One math lesson, for example 07_Vector2 (change the last folder name):
;   build_src_filter = +<*> -<Step1_JUL/> -<Step2_Generator/> -<Step3_Generated/> -<Step4_MathLessons/> +<Step4_MathLessons/07_Vector2/>
;
;
;
; Lessons: 01_Bitwise 02_TypeConv 03_LinearMap 04_MiscMath
;   05_RandomNumber 06_Statistics 07_Vector2 08_Point2 09_Vector3
;   10_Point3 11_Matrix2x2 12_Matrix3x3 13_Matrix4x4 14_Quaternion
;   15_LineFit 16_Rotation 17_DeadZone 18_MotorLineFit 19_JoystickFrame
;
; Ubuntu to Device Port - 20230116
; VSCode - PlatformIO - Arduino Uno: 
;    /dev/ttyACM0 – Permission Denied Issue
; ISSUE: “Permission denied” error on the serial 
; port /dev/ttyACM0 while uploading the Arduino 
; sketch.
; FIX from the Source: 
; https://www.shellhacks.com/arduino-dev-ttyacm0-permission-denied
; Terminal Commands
;   'stat /dev/ttyACM0' <to check the status>
; To permanently solve the issue with the permissions 
; for /dev/ttyACM0 ,
; add the user to the dialout group:
;   'sudo usermod -a -G dialout <username>'
;
; Issue occurs after re-installing VSCode
; Source:
; https://linuxiac.com/install-visual-studio-code-on-ubuntu-22-04/
;
; Raspberry Pi 5, Raspberry Pi OS to Device Port - 20261017
; The author's development computer. VSCode - PlatformIO - Arduino Uno:
; an Uno with the ATmega16U2 USB chip appears as /dev/ttyACM0; a
; clone with a CH340 USB chip appears as /dev/ttyUSB0.
; Terminal Commands
;   'ls /dev/ttyACM* /dev/ttyUSB*' <to find the port>
;   'ls -l /dev/serial/by-id/' <a name that stays the same when
;                               other USB devices are connected>
;   'groups' <the user must be in the dialout group>
; The first user of Raspberry Pi OS is normally in the dialout group.
; If not, the Ubuntu fix above applies:
;   'sudo usermod -a -G dialout <username>', then log out and in.
monitor_speed = 9600
;
; Monitor log file (in env:step3 up to v3.0.0, here since v3.0.1):
; the PlatformIO monitor also saves its output in a log file in this
; folder, so the program printed by Step2_Generator can be copied
; from the file (the log files are listed in .gitignore).
monitor_filters = default, log2file
;
; Upload port (REQUIRED, revised 20261018 for v3.2.0; up to v3.1.2
; the port was left to automatic detection). The author's bench test
; showed that the upload does not work without it. Before the first
; upload, remove the comment mark from ONE upload_port line and the
; monitor_port line below it, and change both to the port of YOUR
; computer; pio device list prints the ports. The monitor_port line
; keeps the serial monitor of Step1_JUL and Step2_Generator on the
; same port.
; macOS:
; upload_port = /dev/cu.usbmodem*
; Linux:
; upload_port = /dev/ttyACM0
; Raspberry Pi 5, Raspberry Pi OS (CH340 clone: /dev/ttyUSB0):
; upload_port = /dev/ttyACM0
; Windows:
; upload_port = COM4
; All computers, the same port as upload_port:
; monitor_port = /dev/ttyACM0
;
; Notes on the C++ standard (added 20261017 for v3.0.1):
; The series is written for C++11 (GNU++11), the standard named in
; Articles 1004 and 1009. The Arduino AVR framework passes
; -std=gnu++11 itself, so build_flags = -std=gnu++17 alone would hand
; the compiler two standards. To use C++17, change lines 18 and 21 to:
;   build_unflags = -std=gnu++11
;   build_flags = -std=gnu++17
; avr-gcc 7.3.0, the compiler of the atmelavr platform, supports the
; C++17 language features (if constexpr, structured bindings, inline
; variables, fold expressions, constexpr lambdas). The AVR toolchain
; has no C++ standard library, so <vector>, <optional>, <array>, and
; the other library headers remain unavailable, as with C++11.
; Checked 20261017 with avr-gcc 7.3.0 and ArduinoCore-avr 1.8.6 and
; -std=gnu++17: the Arduino core compiles with no warnings; Step1_JUL
; builds to the same Intel HEX as with -std=gnu++11; Step2_Generator,
; Step3_Generated, and lessons 07, 14, and 16 build with no warnings.
; The other lessons and the Experiment projects were not checked.
; The shipped setting stays -std=gnu++11 to match the articles.
;
; Step2_Generator and Step3_Generated (added 20261017; named
; Step3_Generator and Step4_Generated until v3.1.0): up to v3.0.0
; they were built in environments env:step3 and env:step4 with the
; flags STEP3_GENERATOR and STEP4_GENERATED. Since v3.0.1 they are
; selected with build_src_filter above, like every other program.
