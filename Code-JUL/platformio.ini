; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; 
; Changes 20230120

[env:uno]
platform = atmelavr
board = uno
framework = arduino
;
; build_unflags = -std=gnu++11
; build_unflags = -std=c++11
;
build_flags = -std=gnu++11
;
; build_src_filter uses +<*> as wild card for 
; folders placed inside the src-folder..., 
; all folders have to be accounted where + indicates 
; the active folder, - indicates folders to ignore...
; Step1_Joystick: main.cpp
;       Determine joystick, UNO programmatic connections...
; Step2_JUL: - Joystick-Uno-L298N: main.cpp
; Step3_MathLessons: math lessons 01 to 19 (see the notes below)
build_src_filter = +<*> -<Step1_Joystick/> +<Step2_JUL/> -<Step3_MathLessons/>
;
; Notes on build_src_filter (added 20261008):
; Exactly one program may be compiled at a time, because each folder
; defines its own setup() and loop(). The filter is read from left to
; right: +<*> starts with every folder, each - removes a folder, and a
; + that follows a - adds one folder back. Since Step3_MathLessons was
; added, every setting must also exclude it with -<Step3_MathLessons/>.
;
; Step1_Joystick:
;   build_src_filter = +<*> +<Step1_Joystick/> -<Step2_JUL/> -<Step3_MathLessons/>
; Step2_JUL (shipped setting):
;   build_src_filter = +<*> -<Step1_Joystick/> +<Step2_JUL/> -<Step3_MathLessons/>
; One math lesson, for example 07_Vector2 (change the last folder name):
;   build_src_filter = +<*> -<Step1_Joystick/> -<Step2_JUL/> -<Step3_MathLessons/> +<Step3_MathLessons/07_Vector2/>
;
; Lessons: 01_Bitwise 02_TypeConv 03_LinearMap 04_MiscMath
;   05_RandomNumber 06_Statistics 07_Vector2 08_Point2 09_Vector3
;   10_Point3 11_Matrix2x2 12_Matrix3x3 13_Matrix4x4 14_Quaternion
;   15_LineFit 16_Rotation 17_DeadZone 18_MotorLineFit 19_JoystickFrame
;
; Ubuntu to Device Port - 20230116
; VSCode - PlatformIO - Arduino Uno: 
;    /dev/ttyACM0 – Permission Denied Issue
; ISSUE: “Permission denied” error on the serial 
; port /dev/ttyACM0 while uploading the Arduino 
; sketch.
; FIX from the Source: 
; https://www.shellhacks.com/arduino-dev-ttyacm0-permission-denied
; Terminal Commands
;   'stat /dev/ttyACM0' <to check the status>
; To permanently solve the issue with the permissions 
; for /dev/ttyACM0 ,
; add the user to the dialout group:
;   'sudo usermod -a -G dialout <username>'
;
; Issue occurs after re-installing VSCode
; Source:
; https://linuxiac.com/install-visual-studio-code-on-ubuntu-22-04/
monitor_speed = 9600
; Optional: set upload_port only if auto-detect fails
; upload_port = COM4
;
; ---------------------------------------------------------------
; Step4_Generator (added 20261017)
; ---------------------------------------------------------------
; Step4_Generator has its own environment, so the build_src_filter
; lines above stay as they are. Its main.cpp compiles only when
; STEP4_GENERATOR is defined, which only this environment does; in
; env:uno the folder compiles to nothing. In VS Code, select the
; environment env:step4 in the PlatformIO status bar, or run:
;   pio run -e step4 -t upload -t monitor
; The Build and Upload buttons build env:uno unless step4 is selected
; (default_envs below).
[env:step4]
platform = atmelavr
board = uno
framework = arduino
build_flags = -std=gnu++11 -D STEP4_GENERATOR
build_src_filter = +<*> -<Step1_Joystick/> -<Step2_JUL/> -<Step3_MathLessons/>
monitor_speed = 9600
; The monitor also saves its output in a log file in this folder, so
; the printed program can be copied from the file.
monitor_filters = default, log2file
;
; ---------------------------------------------------------------
; Step5_Generated (added 20261017)
; ---------------------------------------------------------------
; Holds the program printed by Step4_Generator, which includes
; include/claude/ace.h only. Its main.cpp compiles only when
; STEP5_GENERATED is defined, which only this environment does.
; Paste a new printed program over it after the Step1 or Step2
; results change. The shipped file was printed for
; the author's bench: x A1, y A0, bits_1010.
;   pio run -e step5 -t upload
[env:step5]
platform = atmelavr
board = uno
framework = arduino
build_flags = -std=gnu++11 -D STEP5_GENERATED
build_src_filter = +<*> -<Step1_Joystick/> -<Step2_JUL/> -<Step3_MathLessons/>
monitor_speed = 9600

[platformio]
default_envs = uno
