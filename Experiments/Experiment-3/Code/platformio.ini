; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Experiment-3, Article 1004. The include folder holds copies of the
; original header files of Code-JUL/include (commit f2307a1).

[env:uno]
platform = atmelavr
board = uno
framework = arduino
;
; Same language standard as Code-JUL/platformio.ini
build_flags = -std=gnu++11
;
; build_src_filter selects which lab folder under src/ is compiled.
; +<*> includes the src/ folder and everything under it as the
; starting set. A leading + includes a folder, a leading - excludes
; it. Exactly one lab folder must be included at a time because each
; lab defines its own setup() and loop().
;
;   Lab 1: +<*> +<1_MiscMath/> -<2_DutyCycle/>
;   Lab 2: +<*> -<1_MiscMath/> +<2_DutyCycle/>
;
build_src_filter = +<*> +<1_MiscMath/> -<2_DutyCycle/>
;
; Serial port (REQUIRED, revised 20261018 for v3.2.0). The author's
; bench test showed that the upload does not work with the port left
; to automatic detection. Before the first upload, remove the comment
; mark from the upload_port line and the monitor_port line and change
; both to the port of YOUR computer. 'pio device list' (PlatformIO
; Core CLI) prints the ports; the Uno is the one that appears when
; its USB cable is plugged in. Examples:
;   Raspberry Pi OS, Linux: /dev/ttyACM0 (CH340 clone: /dev/ttyUSB0)
;   macOS:   /dev/cu.usbmodem14101 (the number differs)
;   Windows: COM3 (the number differs)
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
;
monitor_speed = 9600
