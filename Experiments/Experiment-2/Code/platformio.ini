; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Experiment-2, Article 1004. The include folder holds copies of the
; original header files of Code-JUL/include (commit f2307a1).

[env:uno]
platform = atmelavr
board = uno
framework = arduino
;
; Same language standard as Code-JUL/platformio.ini
build_flags = -std=gnu++11
;
; build_src_filter selects which lab folder under src/ is compiled.
; +<*> includes the src/ folder and everything under it as the
; starting set. A leading + includes a folder, a leading - excludes
; it. Exactly one lab folder must be included at a time because each
; lab defines its own setup() and loop().
;
;   Lab 1: +<*> +<1_Preprocessor/> -<2_LinearMap/>
;   Lab 2: +<*> -<1_Preprocessor/> +<2_LinearMap/>
;
build_src_filter = +<*> +<1_Preprocessor/> -<2_LinearMap/>
;
; Serial port. Leave upload_port unset so PlatformIO detects the
; board automatically. Set it only if detection fails, for example:
;   Linux:   upload_port = /dev/ttyACM0
;   macOS:   upload_port = /dev/cu.usbmodem14101
;   Windows: upload_port = COM3
; upload_port = /dev/ttyACM0
;
monitor_speed = 9600
