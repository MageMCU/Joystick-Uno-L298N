<text x="40" y="1270" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Experiment-4, Lab 3. The L298N logic header is disconnected and the bench supply is</text>
<text x="40" y="1328" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">unplugged. Each LED label gives the L298N input that the pin drives in Article 1009,</text>
<text x="40" y="1386" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Circuit-1, and the name in the L298N class.</text>
<text x="40" y="1458" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Each LED has a 1 kΩ resistor: I = (5 V − Vf) / R, about 3 mA for a red LED. With all six</text>
<text x="40" y="1516" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">LEDs and the indicator LED on D12 lit, the total is about 21 mA, well under the 100 mA</text>
<text x="40" y="1574" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">limit of the pin group D5 to D13. Every ground symbol is the common ground.</text>
<text x="40" y="1672" font-size="34" font-family="DejaVu Sans" fill="#000" stroke="none">Revised 20261115. Designed: Jesse Carpenter and Claude (Anthropic).</text></svg>