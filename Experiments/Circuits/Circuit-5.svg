<line x1="1700" y1="830" x2="1700" y2="906"/>
<circle cx="1700" cy="920" r="14" fill="#fff"/>
<text x="1730" y="935" font-size="42" text-anchor="start" font-weight="normal" font-family="DejaVu Sans" font-style="normal" fill="#000" stroke="none">TP3 5 V</text>
<text x="40" y="1020" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Measurements with the multimeter, raw readings first; red lead to the point, black lead</text>
<text x="40" y="1078" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">to GND: V(bus): TP1. V(A2): TP2. V(ref): TP3, the 5 V bus, which is AVCC, the reference</text>
<text x="40" y="1136" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">of the ADC.</text>
<text x="40" y="1208" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">V(A2) = V(bus) × R16 / (R15 + R16) = V(bus) × 10 / 78</text>
<text x="40" y="1280" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">count = V(A2) / V(ref) × 1023</text>
<text x="40" y="1352" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Before fitting R15 and R16, measure each with the ohmmeter and record it; use the</text>
<text x="40" y="1410" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">measured values. Drawn from the Bus Monitor section of Article 1009, Circuit-4B. Every</text>
<text x="40" y="1468" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">ground symbol is the common ground.</text>
<text x="40" y="1566" font-size="34" font-family="DejaVu Sans" fill="#000" stroke="none">Revised 20261115. Designed: Jesse Carpenter and Claude (Anthropic).</text></svg>