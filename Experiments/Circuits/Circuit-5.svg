<text x="1430" y="414" font-size="42" text-anchor="start" font-weight="normal" font-family="DejaVu Sans" font-style="normal" fill="#000" stroke="none">TP2 A2</text>
<text x="1900" y="780" font-size="42" text-anchor="end" font-weight="normal" font-family="DejaVu Sans" font-style="normal" fill="#000" stroke="none">A: 5 V bus, VCC and AVCC of U3</text>
<line x1="1500" y1="830" x2="1900" y2="830"/>
