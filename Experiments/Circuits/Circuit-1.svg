<text x="40" y="940" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Experiment-1, Labs 3 and 4. No bench supply: the USB cable to the computer is the only</text>
<text x="40" y="998" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">supply, and the 5V pin of the Uno supplies the push button. From Experiment-2 onward</text>
<text x="40" y="1056" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">every breadboard device takes 5 V from the 5 V bus of the bench supply.</text>
<text x="40" y="1128" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Released, D2 reads LOW; pressed, HIGH: Button(buttonPin, buttonLED, false). The</text>
<text x="40" y="1186" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">indicator LED has a 1 kΩ resistor, about 3 mA.</text>
<text x="40" y="1284" font-size="34" font-family="DejaVu Sans" fill="#000" stroke="none">Revised 20261115. Designed: Jesse Carpenter and Claude (Anthropic).</text></svg>