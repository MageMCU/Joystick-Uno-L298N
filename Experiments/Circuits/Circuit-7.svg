<text x="40" y="1020" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Measurements with the multimeter, raw readings first; red lead to the first point, black</text>
<text x="40" y="1078" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">lead to the second: V(BT1): TP8 to TP11, S3 at OFF, then at RUN. At OFF the second pole</text>
<text x="40" y="1136" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">of S3 opens the ground lead, so GND is not BT1 −; at RUN, TP11 is the common ground.</text>
<text x="40" y="1194" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">V(bus): TP1, test point (2), to GND. V(DS) of Q3: TP9 to TP1, the drop of the protection,</text>
<text x="40" y="1252" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">motors stopped and running. V(GS) of Q3: TP10 to TP1.</text>
<text x="40" y="1324" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">S3 is shown at RUN; its CHARGE throws and J3 are not drawn. Every ground symbol is</text>
<text x="40" y="1382" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">the common ground. Drawn from the robot supply of Article 1009, Circuit-4A.</text>
<text x="40" y="1480" font-size="34" font-family="DejaVu Sans" fill="#000" stroke="none">Revised 20261115. Designed: Jesse Carpenter and Claude (Anthropic).</text></svg>