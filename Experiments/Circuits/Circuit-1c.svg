<text x="40" y="690" font-size="40" text-anchor="start" font-family="DejaVu Sans Mono" font-weight="normal" font-style="italic" fill="#444" stroke="none">button.begin();</text>
<text x="40" y="740" font-size="40" text-anchor="start" font-family="DejaVu Sans Mono" font-weight="normal" font-style="italic" fill="#444" stroke="none">pinMode(buttonPin, INPUT);</text>
