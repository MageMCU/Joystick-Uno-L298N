<text x="40" y="640" font-size="40" text-anchor="start" font-family="DejaVu Sans Mono" font-weight="normal" font-style="italic" fill="#444" stroke="none">button = Button(buttonPin, buttonLED, false);</text>
<text x="830" y="200" font-size="38" font-family="DejaVu Sans Mono" fill="#000" stroke="none" xml:space="preserve"><tspan font-weight="bold">Closed button: </tspan><tspan font-weight="normal">D2 connects to 5 V;</tspan></text>
<text x="830" y="250" font-size="38" font-family="DejaVu Sans Mono" fill="#000" stroke="none" xml:space="preserve"><tspan font-weight="normal">D2 reads HIGH.</tspan></text>
<text x="830" y="330.0" font-size="38" font-family="DejaVu Sans Mono" fill="#000" stroke="none" xml:space="preserve"><tspan font-weight="bold">Open button: </tspan><tspan font-weight="normal">the pull down</tspan></text>
<text x="830" y="380.0" font-size="38" font-family="DejaVu Sans Mono" fill="#000" stroke="none" xml:space="preserve"><tspan font-weight="normal">resistor holds D2 at GND;</tspan></text>
<text x="830" y="430.0" font-size="38" font-family="DejaVu Sans Mono" fill="#000" stroke="none" xml:space="preserve"><tspan font-weight="normal">D2 reads LOW.</tspan></text>
<text x="830" y="510.0" font-size="38" font-family="DejaVu Sans Mono" fill="#000" stroke="none" xml:space="preserve"><tspan font-weight="normal">Without the resistor, an open</tspan></text>
<text x="830" y="560.0" font-size="38" font-family="DejaVu Sans Mono" fill="#000" stroke="none" xml:space="preserve"><tspan font-weight="normal">input floats and reads at random.</tspan></text><g transform="translate(0,730)"><circle cx="170" cy="120" r="66" fill="#f9d4f2"/>
