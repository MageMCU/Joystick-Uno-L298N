<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="1580" viewBox="0 0 1950 1580" stroke="#000" stroke-width="5"><rect width="1950" height="1580" fill="#fff" stroke="none"/><circle cx="170" cy="120" r="66" fill="#d4f6fa"/>
