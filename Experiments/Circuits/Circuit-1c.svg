<text x="305" y="400" font-size="42" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-style="normal" fill="#000" stroke="none">Pull down</text>
<text x="305" y="450" font-size="42" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-style="normal" fill="#000" stroke="none">resistor</text>
