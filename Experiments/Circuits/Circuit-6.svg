<text x="40" y="1120" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Measurements with the multimeter, raw readings first; red lead to the first point, black</text>
<text x="40" y="1178" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">lead to the second: V(bus): TP1 to GND. V(VS): TP5 to GND. V(D4): TP7 to GND. V(CE) of</text>
<text x="40" y="1236" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Q2: TP6 to GND. V(GS) of Q1: TP4 to TP1. V(SD) of Q1: TP1 to TP5, with the motors</text>
<text x="40" y="1294" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">running.</text>
<text x="40" y="1366" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">With Q2 on, R1 and R2 divide the bus: V(GS) = −V(bus) × R1 / (R1 + R2) = −V(bus) / 2.</text>
<text x="40" y="1438" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Drawn from the Motor Power Switch section of Article 1009, Circuit-4B. Every ground</text>
<text x="40" y="1496" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">symbol is the common ground.</text>
<text x="40" y="1594" font-size="34" font-family="DejaVu Sans" fill="#000" stroke="none">Revised 20261115. Designed: Jesse Carpenter and Claude (Anthropic).</text></svg>