<text x="40" y="1230" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Experiment-2, Lab 3. The joystick and its pull up take 5 V from the 5 V bus of the bench</text>
<text x="40" y="1288" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">supply, as in Article 1009, Circuit-1 and Circuit-1a; the 5V pin of the Uno is not used. The</text>
<text x="40" y="1346" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">L298N is not connected yet. The Uno is powered by its USB cable. Upload with the</text>
<text x="40" y="1404" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">bench supply off; turn it on after the program starts.</text>
<text x="40" y="1476" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Pressed, SW connects D2 to GND: D2 reads LOW. If SW connects to 5 V when pressed,</text>
<text x="40" y="1534" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">fit the 10 kΩ from SW to GND (pull down) and use activeLow = false. The indicator LED</text>
<text x="40" y="1592" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">on D12 has a 1 kΩ resistor, about 3 mA. Every ground symbol is the common ground.</text>
<text x="40" y="1690" font-size="34" font-family="DejaVu Sans" fill="#000" stroke="none">Revised 20261115. Designed: Jesse Carpenter and Claude (Anthropic).</text></svg>