<text x="40" y="1370" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Experiment-3, Lab 2. ENA, ENB, and 5 V regulator jumpers removed. The 5 V bus</text>
<text x="40" y="1428" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">supplies the L298N logic, the joystick, and its pull up; the Uno is powered by its USB</text>
<text x="40" y="1486" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">cable. The black ground wire is the only power connection between the bench supply</text>
<text x="40" y="1544" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">and the Uno. Upload with the bench supply off; apply it last.</text>
<text x="40" y="1642" font-size="34" font-family="DejaVu Sans" fill="#000" stroke="none">Revised 20261115. Designed: Jesse Carpenter and Claude (Anthropic).</text></svg>