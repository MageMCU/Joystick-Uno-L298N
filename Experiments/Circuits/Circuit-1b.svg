<text x="40" y="940" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Experiment-1, Lab 3, The Signal of the Push Button. No bench supply: the USB cable to</text>
<text x="40" y="998" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">the computer is the only supply, and the 5V pin of the Uno supplies the pull up resistor.</text>
<text x="40" y="1070" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">Released, D2 reads HIGH; pressed, LOW: Button(buttonPin, buttonLED), then</text>
<text x="40" y="1128" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">button.begin(); pinMode(buttonPin, INPUT); turns the internal pull up off. The indicator</text>
<text x="40" y="1186" font-size="42" font-family="DejaVu Sans" fill="#000" stroke="none">LED has a 1 kΩ resistor, about 3 mA.</text>
<text x="40" y="1284" font-size="34" font-family="DejaVu Sans" fill="#000" stroke="none">Revised 20261115. Designed: Jesse Carpenter and Claude (Anthropic).</text></svg>